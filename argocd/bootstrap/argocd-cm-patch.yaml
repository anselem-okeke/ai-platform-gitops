apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: "https://argocd.ai-platform.local"

  admin.enabled: "false" 

  # Prevent deployers from synchronizing an arbitrary Git revision
  # unless they also receive the dangerous override permission.
  application.sync.requireOverridePrivilegeForRevisionSync: "true"

  oidc.config: |
    name: Keycloak
    issuer: https://auth.ai-platform.local/realms/ai-platform
    clientID: ai-platform-argocd
    enablePKCEAuthentication: true
    refreshTokenThreshold: 2m
    requestedScopes:
      - openid
      - profile
      - email
      - groups
      - offline_access
    
