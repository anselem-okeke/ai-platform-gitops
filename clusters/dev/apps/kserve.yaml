apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: ai-platform

  source:
    repoURL: ghcr.io/kserve/charts
    chart: kserve-resources
    targetRevision: v0.19.0

    helm:
      releaseName: kserve

      valuesObject:
        kserve:
          # KServe v0.19.0 always appends :<tag> to
          # kserve.storage.image, so a digest-pinned image cannot be
          # expressed through that value.
          #
          # Disable the shared-resource default, explicitly retain
          # the ConfigMap and cert-manager resources, and manage
          # ClusterStorageContainer/default separately through GitOps.
          createSharedResources: false

          inferenceServiceConfig:
            enabled: true

          certManager:
            enabled: true

          storagecontainer:
            enabled: false

          controller:
            deploymentMode: Standard

            gateway:
              ingressGateway:
                enableGatewayApi: true
                kserveGateway: gateway-system/shared-gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: kserve

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
