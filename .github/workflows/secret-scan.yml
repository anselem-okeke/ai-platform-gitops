name: Secret Scan

on:
  push:
  pull_request:

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          GITLEAKS_VERSION="8.28.0"
          ARCH="x64"

          curl -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"

          curl -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          grep \
            "gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | sha256sum -c -

          tar -xzf \
            "gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" \
            gitleaks

          sudo install \
            -m 0755 \
            gitleaks \
            /usr/local/bin/gitleaks

          gitleaks version

      - name: Scan repository history
        shell: bash
        run: |
          set -euo pipefail

          gitleaks git \
            --redact \
            --verbose \
            .
