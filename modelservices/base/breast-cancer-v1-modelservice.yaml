apiVersion: platform.anselem.dev/v1alpha1
kind: ModelService
metadata:
  name: breast-cancer-v1
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: breast-cancer-v1
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: ai-platform

spec:
  backend: KServe
  replicas: 1

  predictor:
    modelFormat:
      name: sklearn
      version: "1"

    runtime: kserve-sklearnserver
    storageUri: s3://models/sklearn/breast-cancer/v1/558e4b26c9fbbd1f3799df827762d62beefc6571
    serviceAccountName: kserve-model-reader

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
