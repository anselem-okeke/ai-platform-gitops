apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kserve-model-reader
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: kserve-model-reader
    app.kubernetes.io/component: model-storage-access
    app.kubernetes.io/part-of: ai-platform

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: kserve-model-reader
    creationPolicy: Owner

    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: kserve-model-reader
          app.kubernetes.io/component: model-storage-access
          app.kubernetes.io/part-of: ai-platform

        annotations:
          serving.kserve.io/s3-endpoint: minio.model-storage.svc.cluster.local:9000
          serving.kserve.io/s3-usehttps: "0"
          serving.kserve.io/s3-useanoncredential: "false"
          serving.kserve.io/s3-usevirtualbucket: "false"

  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ai-platform/model-storage/kserve-reader
        property: access-key

    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ai-platform/model-storage/kserve-reader
        property: secret-key
