apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-artifact-writer
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: model-artifact-onboarding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: model-artifact-writer
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ai-platform/model-storage/artifact-writer
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ai-platform/model-storage/artifact-writer
        property: secret-key
