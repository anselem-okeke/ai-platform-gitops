apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-api
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: ai-platform-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-platform-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ai-platform

    spec:
      serviceAccountName: ai-platform-api

      # Intentional.
      # The API requires Kubernetes API credentials to manage ModelService CRs.
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: platform-api
          image: ai-platform-api:dev
          imagePullPolicy: Never
#          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: HTTP_ADDRESS
              value: ":8080"

            - name: MODEL_SERVICE_NAMESPACE
              value: "ai-platform"

            - name: MAX_MODEL_REPLICAS
              value: "10"

            - name: OIDC_ISSUER
              value: "https://auth.ai-platform.local/realms/ai-platform"

            - name: OIDC_AUDIENCE
              value: "ai-platform-gateway"

            - name: OIDC_CA_FILE
              value: "/etc/ai-platform/oidc/ca.crt"

            - name: LOG_LEVEL
              value: "info"

            - name: MODEL_GATEWAY_NAME
              value: "shared-gateway"

            - name: MODEL_GATEWAY_NAMESPACE
              value: "gateway-system"

            - name: MODEL_GATEWAY_SECTION_NAME
              value: "fraud-model-https"

            - name: MODEL_GATEWAY_DATAPLANE_NAMESPACE
              value: "envoy-gateway-system"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: oidc-ca
              mountPath: /etc/ai-platform/oidc
              readOnly: true

          readinessProbe:
            httpGet:
              path: /readyz
              port: http

            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: oidc-ca
          configMap:
            name: ai-platform-api-oidc-ca
