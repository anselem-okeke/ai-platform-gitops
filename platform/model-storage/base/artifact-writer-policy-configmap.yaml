apiVersion: v1
kind: ConfigMap
metadata:
  name: model-artifact-writer-policy
  namespace: model-storage
  annotations:
    platform.anselem.dev/policy-validation-version: "3"
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: model-artifact-writer
    app.kubernetes.io/part-of: ai-platform
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::models"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::models"
          ],
          "Condition": {
            "StringLike": {
              "s3:prefix": [
                "staging/*",
                "sklearn/*"
              ]
            }
          }
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::models/staging/*",
            "arn:aws:s3:::models/sklearn/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::models/staging/*"
          ]
        }
      ]
    }
