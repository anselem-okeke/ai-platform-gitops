apiVersion: batch/v1
kind: Job
metadata:
  name: minio-models-bucket-bootstrap
  namespace: model-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: bucket-bootstrap
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: bucket-bootstrap
        app.kubernetes.io/part-of: ai-platform

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mc

          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent

          env:
            - name: MC_CONFIG_DIR
              value: /work/.mc

            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: root-user

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: root-password

          command:
            - /bin/sh
            - -ec

          args:
            - |
              set -eu

              echo "Configuring MinIO client alias..."

              attempt=1
              max_attempts=60

              while ! mc alias set \
                local \
                http://minio.model-storage.svc.cluster.local:9000 \
                "${MINIO_ROOT_USER}" \
                "${MINIO_ROOT_PASSWORD}"
              do
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "ERROR: unable to connect/authenticate to MinIO after ${max_attempts} attempts"
                  exit 1
                fi

                echo "MinIO connection/authentication failed; retrying (${attempt}/${max_attempts})..."
                attempt=$((attempt + 1))
                sleep 5
              done

              echo "PASS: MinIO connection and authentication succeeded"

              echo "Ensuring models bucket exists..."

              mc mb \
                --ignore-existing \
                local/models

              echo "Verifying models bucket..."

              mc stat \
                local/models

              echo "PASS: models bucket exists"

          volumeMounts:
            - name: mc-config
              mountPath: /work

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false

      volumes:
        - name: mc-config
          emptyDir: {}
