apiVersion: batch/v1
kind: Job
metadata:
  name: minio-kserve-model-reader-bootstrap
  namespace: model-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: kserve-model-reader
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: Force=true,Replace=true

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: kserve-model-reader
        app.kubernetes.io/part-of: ai-platform

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mc

          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent

          env:
            - name: MC_CONFIG_DIR
              value: /work/.mc

            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: root-user

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: root-password

            - name: KSERVE_READER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kserve-model-reader-credentials
                  key: access-key

            - name: KSERVE_READER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kserve-model-reader-credentials
                  key: secret-key

          command:
            - /bin/sh
            - -ec

          args:
            - |
              set -eu

              POLICY_NAME="kserve-model-reader-readonly"
              POLICY_FILE="/policy/policy.json"
              MINIO_ENDPOINT="http://minio.model-storage.svc.cluster.local:9000"

              echo "Configuring MinIO administrative alias..."

              attempt=1
              max_attempts=60

              while ! mc alias set \
                local \
                "${MINIO_ENDPOINT}" \
                "${MINIO_ROOT_USER}" \
                "${MINIO_ROOT_PASSWORD}"
              do
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "ERROR: unable to connect/authenticate to MinIO after ${max_attempts} attempts"
                  exit 1
                fi

                echo "MinIO connection/authentication failed; retrying (${attempt}/${max_attempts})..."
                attempt=$((attempt + 1))
                sleep 5
              done

              echo "PASS: MinIO administrative authentication succeeded"

              echo "Verifying models bucket exists..."

              mc stat local/models

              echo "PASS: models bucket exists"

              echo "Reconciling read-only KServe IAM policy..."

              mc admin policy create \
                local \
                "${POLICY_NAME}" \
                "${POLICY_FILE}"

              echo "PASS: reader policy reconciled"

              echo "Reconciling KServe model reader credentials..."

              printf '%s\n%s\n' \
                "${KSERVE_READER_ACCESS_KEY}" \
                "${KSERVE_READER_SECRET_KEY}" \
              | mc admin user add local

              echo "PASS: reader identity reconciled"

              echo "Attaching read-only policy..."

              mc admin policy attach \
                local \
                "${POLICY_NAME}" \
                --user "${KSERVE_READER_ACCESS_KEY}"

              echo "PASS: reader policy attached"

              echo "Verifying reader identity..."

              mc admin user info \
                local \
                "${KSERVE_READER_ACCESS_KEY}"

              echo "Verifying reader policy..."

              mc admin policy info \
                local \
                "${POLICY_NAME}"

              echo "PASS: KServe model reader bootstrap completed"

          volumeMounts:
            - name: mc-config
              mountPath: /work

            - name: reader-policy
              mountPath: /policy
              readOnly: true

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false

      volumes:
        - name: mc-config
          emptyDir: {}

        - name: reader-policy
          configMap:
            name: kserve-model-reader-policy
