apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-platform-api
  namespace: monitoring
  annotations:
    gitops-test.anselem.dev/auto-sync: "1"
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: ai-platform-api
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: ai-platform
data:
  ai-platform-api.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Prometheus scrape health for the AI Platform API.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  },
                  "type": "value"
                }
              ],
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(up{job=\"ai-platform-api\",namespace=\"ai-platform\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "API Target",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Customer-facing API requests per second. Kubernetes health and readiness probes are excluded.",
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(ai_platform_api_http_requests_total{route!=\"/healthz\",route!=\"/readyz\"}[1m]))",
              "refId": "A"
            }
          ],
          "title": "API Requests / sec",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Percentage of customer-facing requests returning HTTP 5xx.",
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "min": 0,
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 9,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "100 * (((sum(rate(ai_platform_api_http_requests_total{route!=\"/healthz\",route!=\"/readyz\",status=~\"5..\"}[5m]))) or vector(0)) / clamp_min(sum(rate(ai_platform_api_http_requests_total{route!=\"/healthz\",route!=\"/readyz\"}[5m])), 0.000001))",
              "refId": "A"
            }
          ],
          "title": "5xx Error Rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "95th percentile latency across customer-facing API routes.",
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "min": 0,
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 14,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ai_platform_api_http_request_duration_seconds_bucket{route!=\"/healthz\",route!=\"/readyz\"}[1m])))",
              "refId": "A"
            }
          ],
          "title": "API p95 Latency",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Requests currently being processed by the Platform API.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 19,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(ai_platform_api_http_requests_in_flight)",
              "refId": "A"
            }
          ],
          "title": "Requests In Flight",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Customer-facing request rate grouped by normalized API route.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (route) (rate(ai_platform_api_http_requests_total{route!=\"/healthz\",route!=\"/readyz\"}[1m]))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "title": "Request Rate by Route",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Customer-facing request rate grouped by HTTP status code.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(ai_platform_api_http_requests_total{route!=\"/healthz\",route!=\"/readyz\"}[1m]))",
              "legendFormat": "HTTP {{status}}",
              "refId": "A"
            }
          ],
          "title": "Request Rate by Status",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "95th percentile request latency grouped by normalized API route.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(ai_platform_api_http_request_duration_seconds_bucket{route!=\"/healthz\",route!=\"/readyz\"}[1m])))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "title": "p95 Latency by Route",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 41,
      "tags": [
        "ai-platform",
        "platform-api",
        "prometheus"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "AI Platform API Overview",
      "uid": "ai-platform-api-overview",
      "version": 1,
      "weekStart": ""
    }