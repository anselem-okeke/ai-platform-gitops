apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-sklearnserver
  annotations:
    serving.kserve.io/server-type: sklearnserver
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: "8080"

  supportedModelFormats:
    - name: sklearn
      version: "1"
      autoSelect: true
      priority: 1

  protocolVersions:
    - v1
    - v2

  containers:
    - name: kserve-container
      image: ghcr.io/anselem-okeke/ai-platform-sklearnserver@sha256:2273cfb3aea6ee8d38175ff972ca9b6c036a57f4e517ff7b83b7bc02bbba8843

      args:
        - --model_name={{.Name}}
        - --model_dir=/mnt/models
        - --http_port=8080

      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        runAsNonRoot: true
