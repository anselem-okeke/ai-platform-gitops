apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: default

spec:
  container:
    name: storage-initializer
    image: ghcr.io/anselem-okeke/ai-platform-storage-initializer@sha256:e9dae5b326b0ff85f39ee8924cdec9ce4299cc8a6bea1cf815b83e511f1eb711
    imagePullPolicy: IfNotPresent

    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 100Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsNonRoot: true

  supportedUriFormats:
    - prefix: gs://
    - prefix: s3://
    - prefix: hdfs://
    - prefix: hf://
    - prefix: webhdfs://
    - regex: https://(.+?).blob.core.windows.net/(.+)
    - regex: https://(.+?).file.core.windows.net/(.+)
    - regex: https?://(.+)/(.+)

  supportsMultiModelDownload: true
  workloadType: initContainer
