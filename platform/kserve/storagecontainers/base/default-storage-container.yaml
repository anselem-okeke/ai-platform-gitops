apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: default

spec:
  container:
    name: storage-initializer
    image: ghcr.io/anselem-okeke/ai-platform-storage-initializer@sha256:a8e9259cbaf66ab791187f9d21361f041a6ebf8b1cb0d33dda69d6340a0c258e
    imagePullPolicy: IfNotPresent

    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 100Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsNonRoot: true

  supportedUriFormats:
    - prefix: gs://
    - prefix: s3://
    - prefix: hdfs://
    - prefix: hf://
    - prefix: webhdfs://
    - regex: https://(.+?).blob.core.windows.net/(.+)
    - regex: https://(.+?).file.core.windows.net/(.+)
    - regex: https?://(.+)/(.+)

  supportsMultiModelDownload: true
  workloadType: initContainer
