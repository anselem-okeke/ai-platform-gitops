apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ai-platform-pod-image-policy
spec:
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers

  variables:
    - name: containers
      expression: >-
        object.spec.containers

    - name: initContainers
      expression: >-
        has(object.spec.initContainers)
        ? object.spec.initContainers
        : []

    - name: ephemeralContainers
      expression: >-
        has(object.spec.ephemeralContainers)
        ? object.spec.ephemeralContainers
        : []

    - name: allContainers
      expression: >-
        variables.containers +
        variables.initContainers +
        variables.ephemeralContainers

  validations:
    - expression: >-
        variables.allContainers.all(
          c,
          c.image.startsWith(
            "ghcr.io/anselem-okeke/"
          )
        )
      message: >-
        All Pod container, initContainer, and ephemeralContainer images
        must come from the approved ghcr.io/anselem-okeke registry namespace.

    - expression: >-
        variables.allContainers.all(
          c,
          c.image.matches(
            '^ghcr\\.io/anselem-okeke/.+@sha256:[0-9a-f]{64}$'
          )
        )
      message: >-
        All Pod container, initContainer, and ephemeralContainer images
        must be pinned to a full sha256 digest.
